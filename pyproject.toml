[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wxq"
version = "1.0.0"
description = "微信本地聊天记录查询工具 — WeChat local chat history query, CLI + MCP server for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "wechat", "weixin", "微信", "chat-history", "chatlog",
    "mcp", "mcp-server", "cli", "sqlcipher", "sqlite", "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "pycryptodome>=3.19,<4",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[project.scripts]
wxq = "wxq.cli:main"
wxq-mcp = "wxq.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wxq = ["py.typed", "bin/*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
